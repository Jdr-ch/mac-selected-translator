<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob: data:;" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #eceef0; }
      #viewport { position: absolute; inset: 0; overflow: auto; padding: 24px; }
      #stage { margin: auto; }
      #stage > svg { display: block; width: 100%; height: 100%; }
      #empty-state { position: absolute; inset: 0; display: grid; place-items: center; color: #858a90; font: 14px -apple-system, sans-serif; pointer-events: none; }
      #empty-state[hidden] { display: none; }
      @media (prefers-color-scheme: dark) { html, body { background: #242628; } }
    </style>
    <script src="renderer.js" defer></script>
  </head>
  <body><main id="viewport"><div id="stage"></div></main><div id="empty-state">暂无流程图</div></body>
</html>
